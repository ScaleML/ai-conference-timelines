    note: >-
      Merged SenSys/IPSN/IoTDI conference, co-located with CPS-IoT Week; two self-contained deadlines, and papers rejected at the 1st deadline
      may be resubmitted only with a substantive revision and a "Response to Reviewers" appendix. The official page lists the 1st-deadline early
      notification as "Wednesday, July 17, 2026" (July 17 is a Friday); camera-ready date TBD. HotCRP kept 1st-deadline registration open until
      June 3, 2026, 11:59 AM EDT, although the website still lists May 29.
