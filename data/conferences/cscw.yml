    note: >-
      From CSCW 2027 on there are no conference submission deadlines: papers go to PACM HCI (CSCW track) via rolling,
      journal-style submission on Manuscript Central (or ToCHI), and accepted papers are invited to present at the next CSCW.
      Conference dates and location not yet announced.
