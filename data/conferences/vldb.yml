    note: >-
      Research papers go through PVLDB Volume 20, with a strict monthly deadline on the 1st of each month
      (April 2026 to March 2027) at 5 PM Pacific Time, and a new mandatory abstract due on the 25th of the previous
      month. Initial decisions usually arrive on the 15th of the following month; revisions are due on the 1st of one
      of the next three months, and June 1, 2027 is the last revision deadline for presentation at VLDB 2027. Papers
      accepted by July 1, 2027 form the VLDB 2027 research track.
